name: Currency Core CI

on:
  pull_request:
    paths:
      - 'backend/prisma/**'
      - 'backend/src/modules/currency/**'
      - 'backend/src/api/v1/currencyRateRoutes.js'
      - 'backend/src/api/v1/index.js'
      - 'backend/tests/currencyRate*.test.js'
      - 'backend/tests/cbrCurrencyProvider.test.js'
      - 'backend/tests/postgresCurrencyRateRepository.test.js'
      - '.github/workflows/currency-core-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  currency-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://softice:softice@localhost:5432/softice
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Require CurrencyRate in Prisma schema
        run: grep -q '^model CurrencyRate {' prisma/schema.prisma

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run Currency Core tests
        run: node --test tests/currencyRateService.test.js tests/cbrCurrencyProvider.test.js tests/postgresCurrencyRateRepository.test.js tests/currencyRateApi.test.js
