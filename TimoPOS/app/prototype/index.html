<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>У Тимоши — TimoPOS 2.0</title>
<style>
:root{--cream:#fff9ef;--paper:#fffefb;--coral:#ff5c63;--green:#118d74;--ink:#241b16;--line:#eadfd2;--muted:#766860;font-family:Inter,system-ui,"Segoe UI",sans-serif;color:var(--ink);background:var(--cream)}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}.wrap{max-width:1280px;margin:auto;padding:24px}.head,.detail{border:1px solid var(--line);border-radius:26px;background:var(--paper);padding:24px;box-shadow:0 14px 38px #5e442f14}.head{display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:16px}.mark{background:var(--coral);border-radius:18px;padding:16px;font-size:27px}.brand small{font-size:11px;letter-spacing:.1em;color:#e94450;font-weight:800}.brand h1{margin:4px 0;font-size:24px}.meta{display:flex;flex-wrap:wrap;gap:18px}.meta label{display:grid;gap:3px;font-size:12px;color:var(--muted)}.meta strong{color:var(--ink);font-size:15px}h2{font-size:28px;margin:30px 0 6px}p{color:var(--muted);line-height:1.5}.tiles{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:150px;gap:14px;margin-top:18px}.tile{border:0;border-radius:24px;text-align:left;padding:20px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 10px 25px #5e442f15}.tile:hover,.tile:focus-visible{outline:3px solid #ffd49f;transform:translateY(-2px)}.tile b{display:block;font-size:25px;margin-bottom:6px}.tile small{opacity:.88}.tile .icon{font-size:29px}.sale,.pickup{grid-column:span 2;color:#fff}.sale{background:var(--coral)}.pickup{background:var(--green)}.orders{background:#ffe1bb}.clients{background:#eedcfc}.shift,.journal,.settings{background:#fff;border:1px solid var(--line)}.stock{background:#daf2ee}.hidden{display:none}.back{padding:11px 15px;border:1px solid var(--line);background:#fff;border-radius:12px}.inner{display:grid;grid-template-columns:1fr 1fr;gap:18px}.inner>div{padding:22px;border:1px solid var(--line);border-radius:18px;background:#fff9f2}.code{display:block;width:100%;padding:15px;text-align:center;letter-spacing:.2em;font-size:28px;border:2px solid #d4c3b6;border-radius:15px}.primary{background:var(--green);border:0;color:#fff;padding:15px;border-radius:14px;font-weight:750;margin-top:12px;width:100%}.primary:disabled{opacity:.5}.hint{padding:13px;background:#fff0d3;border-radius:12px;color:#805418}.footer{font-size:12px;margin-top:24px}@media(max-width:800px){.tiles{grid-template-columns:repeat(2,1fr)}.inner{grid-template-columns:1fr}}@media(max-width:500px){.wrap{padding:12px}.tiles{gap:9px;grid-auto-rows:137px}.tile{padding:15px}.tile b{font-size:20px}.brand h1{font-size:20px}}
</style></head><body>
<main class="wrap"><header class="head"><div class="brand"><div class="mark">🍦</div><div><small>У ТИМОШИ · TIMOPOS 2.0</small><h1>Рабочее место продавца</h1></div></div><div class="meta"><label>Торговая точка<strong>№001 · Демо</strong></label><label>Дата / время<strong id="clock">—</strong></label><label>Погода / локация<strong>Не подключены</strong></label><label>Режим<strong>Без платежей</strong></label></div></header>
<div id="home"><h2>Главное меню</h2><p>Выберите действие для торговой точки</p><section class="tiles">
<button class="tile sale" data-page="sale"><span class="icon">🛒</span><span><b>Продажа</b><small>Каталог и оплата</small></span></button>
<button class="tile pickup" data-page="pickup"><span class="icon">▣</span><span><b>Получить</b><small>Выдать предоплаченный заказ</small></span></button>
<button class="tile orders" data-page="orders"><span class="icon">🧾</span><span><b>Заказы</b><small>История и статусы</small></span></button>
<button class="tile clients" data-page="clients"><span class="icon">👥</span><span><b>Клиенты</b><small>Клуб Тимоши</small></span></button>
<button class="tile shift" data-page="shift"><span class="icon">◷</span><span><b>Смена</b><small>Касса и смены</small></span></button>
<button class="tile stock" data-page="stock"><span class="icon">▤</span><span><b>Остатки</b><small>Ингредиенты</small></span></button>
<button class="tile journal" data-page="journal"><span class="icon">☷</span><span><b>Журнал</b><small>Все операции</small></span></button>
<button class="tile settings" data-page="settings"><span class="icon">⚙</span><span><b>Настройки</b><small>Оборудование</small></span></button>
</section></div><section id="detail" class="detail hidden"><button class="back" id="back">← Главное меню</button><div id="body"></div></section>
<p class="footer">Прототип TimoPOS: никакие платежи, заказы и выдачи не выполняются. API и погода пока не подключены.</p></main>
<script>
(()=>{'use strict';const pages={sale:['Продажа','Каталог, корзина и оплата'],pickup:['Получить','Проверка предоплаченного товара'],orders:['Заказы','Очередь и история'],clients:['Клиенты','Бонусы и профиль'],shift:['Смена','Открытие и завершение'],stock:['Остатки','Ингредиенты'],journal:['Журнал','История операций'],settings:['Настройки','Точка и оборудование']};const home=document.getElementById('home'),detail=document.getElementById('detail'),body=document.getElementById('body');function show(id){const p=pages[id];if(!p)return;home.classList.add('hidden');detail.classList.remove('hidden');body.replaceChildren();const h=document.createElement('h2');h.textContent=p[0];body.append(h);const intro=document.createElement('p');intro.textContent=p[1];body.append(intro);if(id==='pickup'){const layout=document.createElement('div');layout.className='inner';layout.innerHTML='<div><h3>Введите 6 цифр</h3><input id="pickup-code" class="code" placeholder="000000" inputmode="numeric" maxlength="6" aria-label="Код получения"><button id="check" class="primary" disabled>Проверить заказ</button><p id="message">Заказы не подключены.</p></div><div><h3>QR-код</h3><p class="hint">Сканирование будет подключено после внедрения авторизации продавца и защищённого API.</p><p>Выдача проводится без повторной оплаты только после проверки Payment SUCCEEDED.</p></div>';body.append(layout);const input=document.getElementById('pickup-code'),btn=document.getElementById('check');input.addEventListener('input',()=>{input.value=input.value.replace(/\D/g,'').slice(0,6);btn.disabled=input.value.length!==6});btn.addEventListener('click',()=>document.getElementById('message').textContent='Демо: код введён, заказ и платежи не изменены.');}else{const p=document.createElement('p');p.className='hint';p.textContent='Раздел подготовлен для дальнейшей разработки. Подключение к Soft_ICE API впереди.';body.append(p);}}document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>show(b.dataset.page)));document.getElementById('back').addEventListener('click',()=>{detail.classList.add('hidden');home.classList.remove('hidden')});function clock(){document.getElementById('clock').textContent=new Intl.DateTimeFormat('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}).format(new Date())}clock();setInterval(clock,30000)})();
</script></body></html>
