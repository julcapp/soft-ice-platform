<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Оплата заказа — У Тимоши</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#2a241f;background:#f6f2eb}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
    main{width:min(520px,100%);background:#fff;border-radius:28px;padding:32px;box-shadow:0 18px 60px rgba(58,45,34,.12);text-align:center}
    .mark{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;margin:0 auto 20px;background:#e8f7ef;font-size:38px}
    h1{font-size:30px;margin:0 0 14px}
    p{line-height:1.55;color:#655c55}
    a{display:block;margin-top:22px;padding:16px 20px;border-radius:16px;background:#1e8f63;color:#fff;text-decoration:none;font-weight:800}
    small{display:block;margin-top:18px;color:#8a8179}
  </style>
</head>
<body>
  <main>
    <div class="mark">✓</div>
    <h1>Платёжный шаг завершён</h1>
    <p>Вернитесь в Telegram и откройте «Клуб Тимоши». Mini App сам проверит статус оплаты. Повторно оплачивать заказ не нужно.</p>
    <a href="https://t.me/exgorod_bot">Открыть @exgorod_bot</a>
    <small>Если Telegram уже открыт, просто вернитесь в него и нажмите «Проверить оплату».</small>
  </main>
</body>
</html>
