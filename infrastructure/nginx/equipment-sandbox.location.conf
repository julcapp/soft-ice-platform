# Soft ICE Equipment Integration Sandbox
# Include this inside the TLS-enabled server block for the chosen sandbox host.
# Only the supplier-facing equipment API is published. Internal /api routes are NOT proxied.

location = /equipment/v1/health {
    proxy_pass http://127.0.0.1:8791/equipment/v1/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /equipment/v1/ {
    proxy_pass http://127.0.0.1:8791/equipment/v1/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    client_max_body_size 256k;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;

    add_header Cache-Control "no-store" always;
}

# Deliberately do not expose /api/v1/admin/equipment through this public supplier host.
