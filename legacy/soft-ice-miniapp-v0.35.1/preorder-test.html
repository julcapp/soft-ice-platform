<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Предзаказ · У Тимоши</title><link rel="stylesheet" href="/tma.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
html{background:var(--cream)}body{padding:0}.app-shell{width:min(100%,480px);min-height:100dvh;border-radius:0;overflow:visible}#shared-content{padding:22px 20px 30px}#shared-content h1{font-family:Georgia,serif;font-size:32px;line-height:1.1;margin:8px 0 18px}#shared-content h2{font-family:Georgia,serif;font-size:25px}#shared-content p{font-size:14px;line-height:1.5;overflow-wrap:anywhere}.shared-eyebrow{font-weight:800;color:var(--berry);text-transform:uppercase;letter-spacing:.1em;font-size:11px!important}.shared-card{padding:22px;margin:18px 0;border-radius:26px;background:white;box-shadow:var(--shadow)}#shared-content select{display:block;width:100%;min-height:46px;margin:8px 0 14px;border:1px solid var(--line);border-radius:14px;padding:10px;background:white;color:var(--ink);font:inherit}#shared-content button{min-height:44px;border:1px solid var(--line);background:white;border-radius:14px;padding:10px 16px;font-weight:600}#shared-content button:disabled{opacity:.45;cursor:default}#shared-content #pay,#shared-content #pickup-code{width:100%;background:linear-gradient(120deg,var(--berry),var(--berry-dark));color:white;border:0;min-height:54px;box-shadow:0 10px 22px rgba(202,40,73,.18)}#price{font-size:22px!important;font-weight:800}#shared-content details{border:1px solid var(--line);box-shadow:none}#shared-content summary{list-style:none;position:relative;padding-right:20px;font-size:14px;line-height:1.5}#shared-content summary::after{content:'⌄';position:absolute;right:0;top:0}#shared-content summary::-webkit-details-marker{display:none}#shared-content summary small{color:var(--muted)}.pickup-code-value{font-size:38px!important;letter-spacing:.15em;font-weight:800;font-variant-numeric:tabular-nums}.bottom-nav{bottom:0;border-radius:0;height:calc(76px + env(safe-area-inset-bottom))}.bottom-nav button,.bottom-nav button:first-child{color:var(--muted)}.bottom-nav button[aria-current]{color:var(--berry)}.brand{font-family:Georgia,serif;font-size:25px;font-weight:700}button:focus-visible,summary:focus-visible{outline:3px solid var(--berry);outline-offset:3px}
</style></head><body><main id="shared-preorder" class="app-shell"></main>
<script src="/preorder-test.js"></script></body></html>
